name: Deploy to cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 🧾 Checkout code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*  # Use latest LTS Node

      - name: 📦 Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

      - name: 📦 Install frontend dependencies
        run: |
          if [ -f package.json ]; then
            npm ci
          fi

      - name: 🏗️ Build frontend assets
        run: |
          if [ -f package.json ]; then
            npm run build
          fi

      - name: 🧹 Remove unnecessary files before deployment
        run: |
          rm -rf node_modules
          rm -rf tests
          rm -rf .github
          rm -rf .git
          rm -rf .gitignore

      - name: 🔑 Set up SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 🧱 Setup known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
      - name: Test SSH
        run: ssh -T git@github.com || true
      - name: 🚀 Deploy to cPanel via rsync
        run: |
          rsync -azP -e "ssh -p ${{ secrets.SSH_PORT }}" \
          --exclude ".env" \
          --exclude "storage/logs/*" \
          --exclude "vendor" \
          ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.PROJECT_PATH }}

      - name: 🧩 Run post-deploy setup on server
        run: |
          ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            cd ${{ secrets.PROJECT_PATH }}

            echo "🛠 Putting app in maintenance mode..."
            php artisan down 2>/dev/null || true

            echo "📦 Installing composer dependencies..."
            composer install --no-interaction --prefer-dist --optimize-autoloader --no-dev

            echo "🧹 Clearing and optimizing caches..."
            php artisan cache:clear
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            echo "Checking pending migrations..."

            # Delete the old sections migration if it still exists from a previous rsync without --delete
            rm -f database/migrations/2026_05_25_131059_create_sections_table.php
            rm -f database/migrations/2026_05_26_034154_create_timetable_entries_table.php

            # PENDING=$(php artisan migrate:status --pending | grep -cE "^\|")
            
            # if [ "$PENDING" -gt 0 ]; then
                # echo "$PENDING pending migrations found."
                php artisan migrate --force
            # else
                # echo "No pending migrations."
            # fi
            echo "🚀 Rebuilding caches..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "🔧 Setting proper permissions..."
            chmod -R 775 storage bootstrap/cache

            echo "🔓 Bringing app back online..."
            php artisan up

            echo "✅ Deployment completed successfully!"
          EOF